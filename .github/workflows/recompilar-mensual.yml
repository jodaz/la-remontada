name: Recompilar cada mes

# Reconstruye y publica el día 1 de cada mes a las 09:00 UTC (05:00 en
# Venezuela). Las series son mensuales, así que el ranking solo puede cambiar
# al empezar un mes. Reutiliza "Publicar"
# (og:image con Playwright + aviso a Cloudflare Pages, que compila).

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    permissions:
      contents: write
    uses: ./.github/workflows/publicar.yml
    secrets: inherit
