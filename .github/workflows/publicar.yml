name: Publicar

# Compila con Playwright (og:image y capturas) y despliega a Cloudflare Pages.
# Se ejecuta al hacer push a main, a mano, o cuando lo llama
# "Recompilar a diario". El despliegue vive aquí y no en Cloudflare porque el
# build de Pages no trae Chromium para las capturas de og:image.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    name: Compilar y desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MEGA_S4_ENDPOINT: ${{ secrets.MEGA_S4_ENDPOINT }}
      MEGA_S4_BUCKET: ${{ secrets.MEGA_S4_BUCKET }}
      MEGA_S4_ACCESS_KEY_ID: ${{ secrets.MEGA_S4_ACCESS_KEY_ID }}
      MEGA_S4_SECRET_ACCESS_KEY: ${{ secrets.MEGA_S4_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas
        run: pnpm test

      - name: Compilar (og:image, _headers y datos)
        id: build
        env:
          # En producción deben existir las cinco rutas.
          CAPTURAS_ESTRICTO: "1"
        run: pnpm build

      - name: Verificar la CSP en el build
        run: node scripts/headers.ts --verificar

      - name: Archivar las capturas diarias en MEGA S4
        if: env.MEGA_S4_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MEGA_S4_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MEGA_S4_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          fecha=$(date -u +%F)
          aws s3 cp --recursive "dist-capturas/$fecha/" "s3://$MEGA_S4_BUCKET/meme-diario/$fecha/" \
            --endpoint-url "$MEGA_S4_ENDPOINT" --only-show-errors

      - name: Avisar que falta configurar MEGA S4
        if: env.MEGA_S4_BUCKET == ''
        run: echo "::warning::No hay secretos de MEGA S4. Las capturas diarias no se archivan."

      - name: Guardar las capturas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ github.run_id }}
          path: dist-capturas/
          if-no-files-found: warn
          retention-days: 30

      - name: Desplegar en Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name laremontada --branch main --commit-dirty=true
