name: Publicar

# Cloudflare Workers compila y despliega por su integración con Git. Este flujo
# existe porque su build no trae Chromium: genera las og:image con Playwright,
# las versiona en public/og/ y archiva las capturas de cada ejecución en MEGA S4.
# Si las og:image cambian, el commit a main dispara el build de Cloudflare;
# si no, llama al deploy hook para que igual se recompile (el meme cambia con
# el mes). Se ejecuta con "Recompilar cada mes", a mano o al hacer push.

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/og/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    name: Capturas, og:image y aviso a Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
      MEGA_S4_ENDPOINT: ${{ secrets.MEGA_S4_ENDPOINT }}
      MEGA_S4_BUCKET: ${{ secrets.MEGA_S4_BUCKET }}
      MEGA_S4_ACCESS_KEY_ID: ${{ secrets.MEGA_S4_ACCESS_KEY_ID }}
      MEGA_S4_SECRET_ACCESS_KEY: ${{ secrets.MEGA_S4_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas
        run: pnpm test

      - name: Compilar (datos y _headers)
        run: pnpm build

      - name: Verificar la CSP en el build
        run: node scripts/headers.ts --verificar

      - name: Generar og:image y capturas móviles
        env:
          # En producción deben existir las cinco rutas.
          CAPTURAS_ESTRICTO: "1"
        run: pnpm capturas:og

      - name: Archivar las capturas móviles en MEGA S4
        if: env.MEGA_S4_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MEGA_S4_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MEGA_S4_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          fecha=$(date -u +%F)
          aws s3 cp --recursive "dist-capturas/$fecha/" "s3://$MEGA_S4_BUCKET/meme-diario/$fecha/" \
            --endpoint-url "$MEGA_S4_ENDPOINT" --only-show-errors

      - name: Avisar que falta configurar MEGA S4
        if: env.MEGA_S4_BUCKET == ''
        run: echo "::warning::No hay secretos de MEGA S4. Las capturas móviles no se archivan."

      - name: Guardar las capturas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ github.run_id }}
          path: dist-capturas/
          if-no-files-found: warn
          retention-days: 30

      - name: Versionar las og:image si cambiaron
        id: og
        run: |
          git add public/og
          if git diff --cached --quiet; then
            echo "cambio=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "og:image: actualización automática"
            git push
            echo "cambio=true" >> "$GITHUB_OUTPUT"
          fi

      # Sin commit nuevo, Cloudflare no compilaría solo: lo avisamos.
      - name: Recompilar en Cloudflare
        if: steps.og.outputs.cambio == 'false'
        run: |
          test -n "$CF_DEPLOY_HOOK" || { echo "::error::Falta el secreto CF_DEPLOY_HOOK"; exit 1; }
          curl -fsS -X POST "$CF_DEPLOY_HOOK"
